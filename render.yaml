services:
  - type: web
    name: dinedesk-app
    runtime: docker
    plan: starter
    dockerfilePath: ./My_Workspace/Dockerfile
    dockerContext: ./My_Workspace
    healthCheckPath: /api/health
    disk:
      name: dinedesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BUNDU_ENV
        value: production
      - key: BUNDU_DATABASE_URL
        fromDatabase:
          name: dinedesk-db
          property: connectionString
      - key: BUNDU_JWT_SECRET
        generateValue: true
      - key: BUNDU_MANAGER_REGISTRATION_KEY
        generateValue: true
      - key: BUNDU_UPLOAD_FOLDER
        value: /var/data/uploads
      - key: BUNDU_ML_MODEL_FOLDER
        value: /var/data/ml_models
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: ZAR

databases:
  - name: dinedesk-db
    databaseName: dinedesk
    user: dinedesk
    plan: basic-256mb
